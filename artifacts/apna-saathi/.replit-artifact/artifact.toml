kind = "web"
previewPath = "/"
title = "Apna Saathi"
description = "A distinctive university student feedback and impact platform that turns lived student experiences into visible action, measurable improvements, and shared trust."
version = "1.0.0"
id = "artifacts/apna-saathi"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25633

[services.development]
run = "pnpm --filter @workspace/apna-saathi run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/apna-saathi", "run", "build" ]
serve = "static"
publicDir = "artifacts/apna-saathi/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25633"
BASE_PATH = "/"
